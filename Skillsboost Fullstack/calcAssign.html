<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="calcAssign.css" />
    <title>Calculator</title>
  </head>
  <body>
    <div id="main">
      <div id="input">
        <p>0</p>
      </div>
      <div id="body">
        <div class="digits">
          <p>7</p>
        </div>
        <div class="digits">
          <p>8</p>
        </div>
        <div class="digits">
          <p>9</p>
        </div>
        <div class="digits right">
          <p>/</p>
        </div>

        <div class="digits">
          <p>4</p>
        </div>
        <div class="digits">
          <p>5</p>
        </div>
        <div class="digits">
          <p>6</p>
        </div>
        <div class="digits right">
          <p>x</p>
        </div>
        <div class="digits">
          <p>1</p>
        </div>
        <div class="digits">
          <p>2</p>
        </div>
        <div class="digits">
          <p>3</p>
        </div>
        <div class="digits right">
          <p>-</p>
        </div>
        <div class="digits">
          <p>0</p>
        </div>
        <div class="digits">
          <p>.</p>
        </div>
        <div class="digits">
          <p>+</p>
        </div>
        <div class="digits right" id="last">
          <p>=</p>
        </div>
      </div>
    </div>
  </body>
</html>
