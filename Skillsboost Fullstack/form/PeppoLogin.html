<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="PeppoLogin.css" />
    <title>Login Page</title>
  </head>
  <body>
    <div>
      <p class="white">< Home Page</p>
      <h3 class="white">
        <img src="snowflake.ico" alt="snowflake" id="snow" /> PEPPO
      </h3>
      <section id="body">
        <div id="form">
          <form action="">
            <div class="center">
              <h2>Welcome Back!</h2>
              <p>We missed you! Please enter your details.</p>
            </div>
            <label for="email">Email</label>
            <br />
            <input
              type="email"
              class="full"
              name="email"
              id="email"
              placeholder="Enter Your Email"
            />
            <br /><br />
            <label for="password">Password</label>
            <br />
            <input
              type="password"
              class="full"
              name="password"
              id="password"
              placeholder="Enter Password"
            />
            <br /><br />

            <div id="list">
              <div>
                <input type="checkbox" name="Remember" id="Remember" />
                <label for="Remember">Remember me</label>
              </div>
              <a href="#" id="forgot">Forgot password?</a>
            </div>
            <br /><br />
            <button class="full blueButton" id="submit" type="submit">
              Sign in
            </button>
            <br /><br />
            <button class="full" type="submit">
              <img src="google_2.ico" alt="google" id="google" /> Sign in with
              Google"
            </button>
            <p class="center">Don't have an account? <a href="#">Sign up</a></p>
          </form>
        </div>
        <p></p>
        <p></p>
        <p></p>
        <p></p>
        <p></p>
        <p></p>
        <p></p>
        <br /><br />
        <p></p>
        <p></p>
        <p></p>
      </section>
    </div>
    <script>
      const mail = document.getElementById("email");
      // document.getElementById("submit").onclick = alert("I am working");

      document.getElementById("submit").onmouseenter = function (event) {
        event.preventDefault();
        console.log(mail.value);
      };

      // document.getElementById("submit").onclick = console.log(email);
    </script>
  </body>
</html>
