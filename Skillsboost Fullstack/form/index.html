<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form_1</title>
  </head>
  <body>
    <form action="" method="">
      <label for="fname">Full Name:</label>
      <input type="text" id="fname" placeholder="John Doe" />
      <!-- here, the "for" in the label takes the id of the input associated with it to bound them together -->
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="yourMail@gmail.com" />
      <label for="password"></label>
      <input type="password" name="" id="password" />
      <input type="datetime" name="" id="" />
      <input type="color" name="" id="" />
      <br />
      <h2>Checkbox</h2>
      <h3>What's your fav food</h3>
      <label for="rice">Rice</label>
      <input type="checkbox" id="rice" value="rice" />

      <br />
      <label for="Beans">Beans</label>
      <input type="checkbox" id="Beans" value="Beans" />
      <br />
      <label for="maize">Maize</label>
      <input type="checkbox" id="maize" value="maize" />
      <br />
      <h2>Radio</h2>
      <h3>What's your fav drink</h3>
      <label for="malt">Malt</label>
      <input type="radio" id="malt" value="malt" name="drink" />
      <label for="cola">Cola</label>
      <input type="radio" id="cola" value="cola" name="drink" />
      <br />
      <label for="cola">Cola</label>
      <input type="radio" id="cola" value="cola" />
      <label for=""></label>
      <label for=""></label>
    </form>
  </body>
</html>
